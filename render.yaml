# Prepared configuration only: importing this Blueprint creates a service.
# One Next.js service; the existing Tiger Data database remains external.
# Free is an explicit preview default. Owner approval is required for paid hosting.
services:
  - type: web
    name: diverse-dmv
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: DB_POOL_MAX
        value: "5"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Only these public Firebase values are consumed as Docker build arguments.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DAILY_CALL_LIMIT
        value: "500"
      - key: INDEXING_JOB_SECRET
        generateValue: true
      - key: OFFICE_PAGE_TOKEN_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_ENABLED
        value: "false"
      - key: OFFICE_DAILY_CALL_LIMIT
        value: "500"
      # Add separate restricted NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY,
      # NEXT_PUBLIC_GOOGLE_MAP_ID and GOOGLE_PLACES_SERVER_KEY in Render's
      # environment editor after Maps project/policy review. Then enable Maps.
