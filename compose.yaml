name: diverse-dmv

services:
  app:
    image: diverse-dmv:latest
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set the public Firebase API key}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set the Firebase auth domain}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set the Firebase project ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set the Firebase app ID}
    env_file:
      - path: ${APP_ENV_FILE:-.env.runtime}
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
